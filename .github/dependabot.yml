# One pull request a week for the npm dependencies of the whole workspace (the root lockfile covers packages/* and dev),
# and one for the actions the workflows pin. Security fixes come as they are published, also in one pull request.
# examples/empty is generated by `hearthlog init` and checked by `pnpm check:examples`, so it is left to that.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
