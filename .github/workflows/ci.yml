name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, unit tests, Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C dev check:ts
      - run: pnpm -C dev check:modules
      - run: pnpm -C dev check:tenants
      - run: pnpm check:examples
      - run: pnpm check:packages
      - run: pnpm test:scripts
      - run: pnpm test:release
      - run: pnpm -C dev test:unit --run
      # The Env declaration check needs every module's bindings: it runs in the integration job.
      - run: pnpm -C dev frontend:worker:typecheck
      - run: pnpm -C dev build
      - run: pnpm -C dev frontend:worker:dry-run
      - run: pnpm -C dev ledger:check
      - run: pnpm -C dev ledger:test
      - run: pnpm -C dev ledger:dry-run

  integration:
    name: With the published modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Installs @hearthlog/module-* from npm into a throwaway project and links them in for this run only; the root
      # package.json and lockfile name no module. Runs the unit and tooling tests that need modules, the type checks,
      # the Env declaration check and the Ledger tests against them.
      - run: pnpm test:integration

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Ubuntu's primary mirror for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test

  tarballs:
    name: Build the empty example from tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:tarballs examples/empty

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A pinned release whose checksum is verified before it runs; scans the tree and the whole history.
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose .
      - run: ./gitleaks dir --redact --no-banner --verbose .
