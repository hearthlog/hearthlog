name: Release

# `pnpm release:version <x.y.z>`, commit, then push the tag `v<x.y.z>`. The publish job waits for approval in the
# protected `npm` environment; the packages are published through npm's trusted publishing, so no registry token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:version --check "$GITHUB_REF_NAME"
      - run: pnpm check:packages
      - run: pnpm check:ts
      - run: pnpm test:unit --run
      - run: pnpm ledger:test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # npm's trusted publishing (OIDC) needs npm 11.5.1 or later; no token is stored anywhere.
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      # Publishes every package whose version is not on the registry yet, with provenance.
      - run: pnpm publish:packages

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
