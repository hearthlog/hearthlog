<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#FBF9FA" />
        <title>App unavailable offline | stor</title>
        <script>
            (() => {
                let preference = "system";
                try {
                    for (let index = 0; index < localStorage.length; index++) {
                        const key = localStorage.key(index);
                        if (key?.startsWith("stor:appearance:")) {
                            const saved = localStorage.getItem(key);
                            if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
                            break;
                        }
                    }
                } catch {}
                const theme = preference === "system"
                    ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                    : preference;
                document.documentElement.dataset.appearance = preference;
                document.documentElement.dataset.theme = theme;
                document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#1b181a" : "#fbf9fa");
            })();
        </script>
        <style>
            :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f5f4;color:#251a18}body{display:grid;min-width:320px;min-height:100vh;place-items:center;margin:0;padding:24px;box-sizing:border-box;background:inherit;color:inherit}.card{width:100%;max-width:480px;border:1px solid #e8ddda;border-radius:20px;background:#fff;padding:28px;box-sizing:border-box;box-shadow:0 12px 40px rgba(60,35,30,.08)}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.logo{display:grid;width:36px;height:36px;place-items:center;border-radius:12px;background:#b23a34;color:#fff;font-family:ui-monospace,monospace;font-size:18px;font-weight:800}.eyebrow{margin:32px 0 0;color:#78716c;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{margin:8px 0 0;font-size:25px;line-height:1.2}p{margin:12px 0 0;color:#57534e;font-size:14px;line-height:1.65}a{display:inline-flex;margin-top:24px;border-radius:12px;background:#251a18;padding:11px 16px;color:#fff;font-size:14px;font-weight:700;text-decoration:none}a:focus-visible{outline:3px solid #b23a34;outline-offset:3px}
            :root[data-theme="dark"]{color-scheme:dark;background:#1b181a;color:#f2f0ed}:root[data-theme="dark"] .card{border-color:#514a4d;background:#272427;box-shadow:0 12px 40px #090b0dcc}:root[data-theme="dark"] .eyebrow,:root[data-theme="dark"] p{color:#b7b9bd}:root[data-theme="dark"] .logo{background:#ce817d;color:#151719}:root[data-theme="dark"] a{background:#ce817d;color:#151719}
            @media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;background:#1b181a;color:#f2f0ed}:root:not([data-theme]) .card{border-color:#514a4d;background:#272427;box-shadow:0 12px 40px #090b0dcc}:root:not([data-theme]) .eyebrow,:root:not([data-theme]) p{color:#b7b9bd}:root:not([data-theme]) .logo{background:#ce817d;color:#151719}:root:not([data-theme]) a{background:#ce817d;color:#151719}}
        </style>
    </head>
    <body>
        <main class="card">
            <div class="brand"><span class="logo">s</span><span>stor</span></div>
            <p class="eyebrow">Offline</p>
            <h1>The app is not available offline yet</h1>
            <p>Connect once to finish installing the offline app, then try again.</p>
            <a href="/">Go to start</a>
        </main>
    </body>
</html>
